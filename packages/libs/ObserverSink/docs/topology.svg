<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .box   { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
    .art   { fill: #f4f4f4; stroke: #777; stroke-width: 1.2; }
    .label { font-size: 13px; fill: #111; }
    .sub   { font-size: 10.5px; fill: #555; }
    .flow  { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .loop  { stroke: #888; stroke-width: 1.3; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 3; }
    .region { fill: none; stroke: #999; stroke-width: 1.2; stroke-dasharray: 7 4; }
    .regionlabel { font-size: 11px; fill: #777; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#111">ObserverSink: telemetry sample in, durable row out</text>
  <text class="sub" x="20" y="46">v1.0.24: bounded writes, monitoring default on, and v5 metric indexes.</text>

  <!-- Main pipeline row -->
  <rect class="box" x="20" y="70" width="140" height="52" rx="6"/>
  <text class="label" x="90" y="92" text-anchor="middle">Intellectus.report</text>
  <text class="sub" x="90" y="108" text-anchor="middle">caller (IntellectusLib)</text>

  <rect class="box" x="200" y="70" width="150" height="52" rx="6"/>
  <text class="label" x="275" y="92" text-anchor="middle">PersistenceStatsSink</text>
  <text class="sub" x="275" y="108" text-anchor="middle">receive() → Task, flag gate</text>

  <rect class="box" x="390" y="70" width="140" height="52" rx="6"/>
  <text class="label" x="460" y="92" text-anchor="middle">StatsStore</text>
  <text class="sub" x="460" y="108" text-anchor="middle">insertMetric / insertEvent</text>

  <!-- Pipeline arrows -->
  <line class="flow" x1="160" y1="96" x2="198" y2="96"/>
  <line class="flow" x1="350" y1="96" x2="388" y2="96"/>
  <line class="flow" x1="460" y1="122" x2="460" y2="188"/>

  <!-- Stats store region -->
  <rect class="region" x="60" y="188" width="760" height="120"/>
  <text class="regionlabel" x="70" y="206">SQLite stats store (StatsStore, schema v3)</text>

  <rect class="art" x="80" y="222" width="120" height="52" rx="6"/>
  <text class="label" x="140" y="244" text-anchor="middle">control</text>
  <text class="sub" x="140" y="260" text-anchor="middle">monitoring flag</text>

  <rect class="art" x="240" y="222" width="140" height="52" rx="6"/>
  <text class="label" x="310" y="244" text-anchor="middle">metric_samples</text>
  <text class="sub" x="310" y="260" text-anchor="middle">name, value, tags, ts</text>

  <rect class="art" x="420" y="222" width="140" height="52" rx="6"/>
  <text class="label" x="490" y="244" text-anchor="middle">event_samples</text>
  <text class="sub" x="490" y="260" text-anchor="middle">kind, noun_type, estate</text>

  <rect class="art" x="600" y="222" width="160" height="52" rx="6"/>
  <text class="label" x="680" y="244" text-anchor="middle">topology_snapshots</text>
  <text class="sub" x="680" y="260" text-anchor="middle">1 row/estate, latest-wins</text>

  <!-- Store internal arrows: flag read then table write -->
  <line class="flow" x1="460" y1="188" x2="200" y2="220" opacity="0.55"/>
  <line class="flow" x1="460" y1="188" x2="310" y2="220" opacity="0.85"/>
  <line class="flow" x1="460" y1="188" x2="490" y2="220" opacity="0.85"/>

  <!-- Autonomic governor writes topology snapshots -->
  <rect class="box" x="620" y="360" width="170" height="52" rx="6"/>
  <text class="label" x="705" y="382" text-anchor="middle">Autonomic Governor</text>
  <text class="sub" x="705" y="398" text-anchor="middle">writeTopologySnapshot</text>

  <line class="loop" x1="705" y1="358" x2="685" y2="276"/>

  <!-- Manager reads samples + snapshots, controls the flag, runs retention -->
  <rect class="box" x="60" y="360" width="200" height="70" rx="6"/>
  <text class="label" x="160" y="382" text-anchor="middle">Manager / moot-mgr</text>
  <text class="sub" x="160" y="398" text-anchor="middle">setMonitoringEnabled</text>
  <text class="sub" x="160" y="412" text-anchor="middle">deleteMetricsBefore / deleteEventsBefore</text>

  <line class="loop" x1="160" y1="358" x2="140" y2="276"/>
  <line class="loop" x1="260" y1="390" x2="310" y2="276"/>
  <line class="loop" x1="260" y1="405" x2="490" y2="276"/>

  <!-- Dashboard reads everything -->
  <rect class="box" x="330" y="470" width="220" height="60" rx="6"/>
  <text class="label" x="440" y="494" text-anchor="middle">Dashboard reads</text>
  <text class="sub" x="440" y="510" text-anchor="middle">queryMetrics(ByNames) · queryEvents ·</text>
  <text class="sub" x="440" y="523" text-anchor="middle">countMetrics · latestTopologySnapshot</text>

  <line class="loop" x1="440" y1="468" x2="310" y2="276"/>
  <line class="loop" x1="440" y1="468" x2="490" y2="276"/>
  <path class="loop" d="M 480 468 C 560 420, 640 340, 680 276"/>
</svg>
